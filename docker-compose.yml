# =============================================================================
# Ontographia V2 - Docker Compose Configuration
# Per ADR-003: PostgreSQL + JSONB (no Neo4j)
# Per Architecture Review: Redis for caching and event bus
# =============================================================================

services:
  # ===========================================================================
  # Application
  # ===========================================================================
  web:
    build: .
    container_name: ontographia-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ontographia
      PGUSER: ontographia
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # PostgreSQL - Primary Database
  # Graph storage using JSONB (ADR-003)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ontographia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ontographia
      POSTGRES_USER: ontographia
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontographia -d ontographia"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=768MB"

  # ===========================================================================
  # Redis - Caching & Event Bus
  # Per Architecture Review F-001: Critical for performance
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ontographia-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  # ===========================================================================
  # Observability Stack (Prometheus + Grafana + Loki)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ontographia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ontographia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 2
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.9.2
    container_name: ontographia-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.2
    container_name: ontographia-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - monitoring

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
