

services:
  neo4j:
    image: neo4j:5.23-community
    container_name: kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data

  web:
    build: .
    container_name: kg-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PGHOST: postgres
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      - neo4j
      - postgres

  postgres:
    image: postgres:15
    container_name: kg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ontographia
      POSTGRES_USER: ontographia
      POSTGRES_PASSWORD: ontographia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  neo4j_data:
  pgdata:
