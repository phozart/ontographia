# =============================================================================
# Ontographia V2 - Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ontographia-monitor'

# Alerting configuration (optional - add Alertmanager later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (optional - add alerting rules later)
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ==========================================================================
  # Prometheus self-monitoring
  # ==========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ==========================================================================
  # Ontographia Application Metrics
  # ==========================================================================
  - job_name: 'ontographia'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'ontographia-web'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # ==========================================================================
  # PostgreSQL Metrics (requires postgres_exporter)
  # ==========================================================================
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

  # ==========================================================================
  # Redis Metrics (requires redis_exporter)
  # ==========================================================================
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'

  # ==========================================================================
  # Node Exporter (optional - for system metrics)
  # ==========================================================================
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'
