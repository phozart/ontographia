# =============================================================================
# Ontographia V2 - Promtail Configuration
# Log collector for the Grafana/Loki stack
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ==========================================================================
  # Docker container logs
  # ==========================================================================
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time

      - regex:
          expression: '^(?P<container_name>/[a-zA-Z0-9_-]+)'
          source: log

      - labels:
          stream:
          container_name:

      - timestamp:
          source: time
          format: RFC3339Nano

  # ==========================================================================
  # Ontographia application logs
  # ==========================================================================
  - job_name: ontographia
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - ontographia-web

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      # Parse JSON logs from Next.js
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            space: space
            userId: userId
            correlationId: correlationId

      - labels:
          level:
          service:
          space:

      - output:
          source: message

  # ==========================================================================
  # System logs (optional)
  # ==========================================================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<hostname>\w+) (?P<process>\w+)\[(?P<pid>\d+)\]: (?P<message>.*)$'
      - labels:
          hostname:
          process:
      - timestamp:
          source: timestamp
          format: Jan 2 15:04:05
